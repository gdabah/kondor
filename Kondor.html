<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kondor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* Layout: one screen. A slim stone-coloured bar on top, the CRT-shaped 4:3 game in the middle, key hints below. */
:root {
  --bg: #0b0d0c;          /* night behind the monitor */
  --panel: #1a1d1b;       /* bezel */
  --stone: #6f726f;       /* the sidebar rock texture's mid grey */
  --fg: #c9ccc8;
  --dim: #7d827c;
  --vine: #3fae3f;        /* the green on the vines */
  --rust: #b8742a;        /* the brown vine stems */
  --font-pixel: "Silkscreen", "Courier New", monospace;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; align-items: center; gap: 12px; padding-block: 8px; padding-inline: 16px; border-bottom: 1px solid #262a27; }
.mark { font-family: var(--font-pixel); font-size: 18px; letter-spacing: 0.12em; color: var(--fg); }
.mark b { color: var(--vine); font-weight: 400; }
.sub { font-size: 12px; color: var(--dim); letter-spacing: 0.04em; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
header button { font: 12px var(--font-pixel); color: var(--fg); background: var(--panel); border: 1px solid #343935; border-radius: 3px; padding: 6px 10px; cursor: pointer; }
header button:hover { border-color: var(--rust); color: #fff; }
header button:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
#stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; padding-inline: 16px; padding-block: 10px; }
#screen { display: block; width: min(100%, calc((100dvh - 120px) * 4 / 3)); max-width: 1280px; aspect-ratio: 4 / 3; height: auto; background: #000; image-rendering: auto; box-shadow: 0 0 0 6px var(--panel), 0 0 0 7px #2c312d, 0 18px 50px rgba(0,0,0,.6); border-radius: 2px; cursor: crosshair; touch-action: none; outline: none; }
footer { padding-block: 6px 10px; padding-inline: 16px; font-size: 12px; color: var(--dim); display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; }
footer kbd { font: 11px var(--font-pixel); color: var(--fg); background: var(--panel); border: 1px solid #343935; border-bottom-width: 2px; border-radius: 3px; padding: 1px 5px; }
#nameinput { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: min(280px, 80%); font: 16px var(--font-pixel); text-transform: uppercase; background: var(--panel); color: #fff; border: 1px solid var(--rust); padding: 8px 10px; border-radius: 3px; }
#touchpad { display: none; position: absolute; inset: auto 0 0 0; padding: 12px 18px max(14px, env(safe-area-inset-bottom, 0px)); pointer-events: none; justify-content: space-between; align-items: flex-end; }
body.touch #touchpad { display: flex; }
body.touch footer { display: none; }
body.touch #screen { width: min(100%, calc((100dvh - 80px) * 4 / 3)); }
@media (orientation: portrait) { body.touch #stage { place-items: start center; padding-block: 18px 200px; } }
#stick { pointer-events: auto; width: 128px; height: 128px; border-radius: 50%; background: rgba(26,29,27,.55); border: 2px solid rgba(111,114,111,.6); display: grid; place-items: center; touch-action: none; }
#knob { width: 52px; height: 52px; border-radius: 50%; background: rgba(111,114,111,.85); border: 2px solid rgba(255,255,255,.25); }
.tbtns { display: grid; grid-template-columns: auto auto; gap: 10px; pointer-events: auto; align-items: end; }
.tb { font: 12px var(--font-pixel); color: #fff; width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(26,29,27,.6); touch-action: none; user-select: none; -webkit-user-select: none; }
.tb.small { width: 52px; height: 40px; border-radius: 8px; font-size: 10px; }
#tfire { width: 84px; height: 84px; background: rgba(150,30,20,.7); }
#titem { background: rgba(35,90,120,.7); }
.tb.on { filter: brightness(1.6); }
@media (max-width: 560px) { .sub { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <span class="mark">KON<b>D</b>OR</span>
  <span class="sub">QSoft, 1999 &middot; Gil Dabah &amp; Oren Becker &middot; browser edition</span>
  <span class="spacer"></span>
  <button id="mute" type="button">Sound on</button>
  <button id="fullscreen" type="button">Full screen</button>
</header>
<main id="stage">
  <canvas id="screen" width="1280" height="960" tabindex="0" aria-label="Kondor game screen"></canvas>
  <input id="nameinput" type="text" maxlength="13" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Your name for the high score table" hidden>
  <div id="touchpad" aria-hidden="true">
    <div id="stick"><div id="knob"></div></div>
    <div class="tbtns">
      <button class="tb small" id="tmenu" type="button">MENU</button>
      <button class="tb small" id="tnext" type="button">NEXT</button>
      <button class="tb" id="titem" type="button">ITEM</button>
      <button class="tb" id="tfire" type="button">FIRE</button>
    </div>
  </div>
</main>
<footer>
  <span><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&rarr;</kbd><kbd>&darr;</kbd> drive</span>
  <span><kbd>Space</kbd> / click fire</span>
  <span>mouse or <kbd>Z</kbd><kbd>X</kbd> aim</span>
  <span><kbd>Enter</kbd> / right click item</span>
  <span><kbd>[</kbd><kbd>]</kbd> pick item</span>
  <span><kbd>P</kbd> pause &middot; <kbd>Esc</kbd> menu</span>
</footer>

'use strict';
/* =====================================================================
   KONDOR  (QSoft 1997-99, Gil Dabah & Oren Becker)
   Browser edition: a port of the original Borland C++ / mode 13h game.
   Rendering is a 320x200 palette-indexed framebuffer, logic runs at the
   original 70Hz VGA refresh rate.
   ===================================================================== */
const A = window.__KONDOR_ASSETS__;
const b64 = s => { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };

/* ---------- constants (DEFINE.H) ---------- */
const SW = 320, SH = 200, VW = 256, VH = 192;
const MAP_W = 96, MAP_H = 96, MAP_PW = 1536, MAP_PH = 1536;
const SCRRANGE = 95;
const BULLETSPD = 5, BULLETDAMAGE = 3, ROCKETDAMAGE = 8;
const TSHOOTRANGE = 18225, ESHOOTRANGE = 9025, MSHOOTRANGE = 4900, FLYTOOCLOSE = 2500, EHUNTRANGE = 10000;
const MAX_ENEMIES = 55, MAX_AIR = 30, MAX_GENERATE = 20, MAX_BULLETS = 160;
const EXPL_LENGTH = 45, TANK_MAX_POWER = 10000, SHIELD_RAD_RATE = 0.5, SHIELD_MAX_RAD = 20, MAX_SHIELD_HITS = 10;
const EPOWERBARSIZE = 20, SPEEDTIME = 30, HIT_SPEED = 0.2, BONUS_RANGE = 7, MAX_LIVE = 3, MAX_LEVELS = 12;
const SCORE_ON_ENEMY = 2, SCORE_ON_AIR_ENEMY = 3, SCORE_ON_GENERATOR = 4;
const TANKW = 23, TANKH = 24, CANNONW = 20, CANNONH = 6, CANNONCY = 4, BULLETW = 5, BULLETH = 5;
const BASE_H = 60, GAPW = 43, GAPH = 21;
const BULLET_MAX_AGE = 35;
const EMPTY = 0, TURRET = 1, CIRCLE = 2, RANDOM = 3, PATH_FIND = 4, ANGLE = 5, FOLLOW = 6, PIPER = 7, MIG = 8;
const PLAYER = 0, ENEMY = 1, AIRENEMY = 2;
const TICK_MS = 1000 / 70;
/* browser-edition tuning (the "more fun" bits) */
const FIRE_COOLDOWN = 9;           // hold fire = autofire
const RESPAWN_INVULN = 175;        // ticks of blinking invulnerability after a respawn
const AIM_SPEED = 12;              // mouse/touch turret slew per tick (of 512)

/* ---------- trig tables (QUNIT.H: 512 steps per circle) ---------- */
const COS = new Float64Array(512), SIN = new Float64Array(512);
for (let i = 0; i < 512; i++) { COS[i] = Math.cos(i * Math.PI / 256); SIN[i] = Math.sin(i * Math.PI / 256); }
const cos = a => COS[(a | 0) & 511], sin = a => SIN[(a | 0) & 511];
const qrad = r => r / Math.PI * 256;
const T = Math.trunc;
const random = n => Math.floor(Math.random() * n);

/* ---------- palettes ---------- */
const P6 = b64(A.pal), PAL18 = b64(A.pal18), PAL20 = b64(A.pal20);
const gamePal = new Uint8Array(768); gamePal.set(P6);
for (let i = 0; i < 16; i++) { gamePal[(i + 90) * 3] = gamePal[(i + 90) * 3 + 1] = gamePal[(i + 90) * 3 + 2] = i * 4; }
// free slots 110..127 (unused by the original art) get a few extra colours for effects
const CUSTOM = { 110: [63, 42, 6], 111: [20, 58, 63], 112: [26, 63, 26], 113: [63, 30, 10], 114: [63, 58, 20], 115: [40, 63, 63], 116: [12, 40, 12], 117: [63, 16, 16] };
for (const k in CUSTOM) { gamePal[k * 3] = CUSTOM[k][0]; gamePal[k * 3 + 1] = CUSTOM[k][1]; gamePal[k * 3 + 2] = CUSTOM[k][2]; }
for (let i = 0; i < 128; i++) for (let c = 0; c < 3; c++) gamePal[(i + 128) * 3 + c] = Math.floor(gamePal[i * 3 + c] * 0.75);
const C_WHITE = 109, C_YELLOW = 106, C_ORANGE = 110, C_CYAN = 111, C_GREEN = 112, C_HOT = 113, C_PALEY = 114, C_ICE = 115, C_DKGREEN = 116, C_RED = 117;

let curPal = gamePal, fade = 1;
const pal32 = new Uint32Array(256);
function buildPal() {
  for (let i = 0; i < 256; i++) {
    const r = Math.min(255, Math.round(curPal[i * 3] * 255 / 63 * fade));
    const g = Math.min(255, Math.round(curPal[i * 3 + 1] * 255 / 63 * fade));
    const b = Math.min(255, Math.round(curPal[i * 3 + 2] * 255 / 63 * fade));
    pal32[i] = 0xff000000 | (b << 16) | (g << 8) | r;
  }
}

/* ---------- framebuffer & blitting (kgraph.h) ---------- */
const fb = new Uint8Array(SW * SH);
let clipW = SW, clipH = SH;
const setClip = (w, h) => { clipW = w; clipH = h; };
const plot = (x, y, c) => { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < clipW && y < clipH) fb[y * SW + x] = c; };
const img = (w, h, d) => ({ w, h, d });
function blit(s, x, y) {
  x = Math.floor(x); y = Math.floor(y);
  for (let iy = 0; iy < s.h; iy++) {
    const py = y + iy; if (py < 0 || py >= clipH) continue;
    for (let ix = 0; ix < s.w; ix++) {
      const c = s.d[iy * s.w + ix]; if (!c) continue;
      const px = x + ix; if (px >= 0 && px < clipW) fb[py * SW + px] = c;
    }
  }
}
function blitCol(s, x, y, col) {
  x = Math.floor(x); y = Math.floor(y);
  for (let iy = 0; iy < s.h; iy++) for (let ix = 0; ix < s.w; ix++) if (s.d[iy * s.w + ix]) plot(x + ix, y + iy, col);
}
function blitAll(s, x, y) { // draws every pixel (used by the anti-aliased font)
  for (let iy = 0; iy < s.h; iy++) for (let ix = 0; ix < s.w; ix++) plot(x + ix, y + iy, s.d[iy * s.w + ix]);
}
// krotsprite / drawsink by inverse mapping: x axis of the sprite points along the angle.
// mode 0 normal, 1 flash (solid colour), 2 sink (border pixels show the darkened ground)
function rot(s, x, y, cx, cy, ang, mode = 0, col = 0, s1 = 0, s2 = 0, s3 = 0, s4 = 0) {
  const c = cos(ang), sn = sin(ang);
  const R = Math.ceil(Math.hypot(Math.max(cx, s.w - cx), Math.max(cy, s.h - cy))) + 1;
  const x0 = Math.max(0, Math.floor(x - R)), x1 = Math.min(clipW - 1, Math.ceil(x + R));
  const y0 = Math.max(0, Math.floor(y - R)), y1 = Math.min(clipH - 1, Math.ceil(y + R));
  const w = s.w, h = s.h, d = s.d;
  for (let py = y0; py <= y1; py++) {
    const dy = py + 0.5 - y;
    for (let px = x0; px <= x1; px++) {
      const dx = px + 0.5 - x;
      const u = Math.floor(cx + dx * c + dy * sn), v = Math.floor(cy - dx * sn + dy * c);
      if (u < 0 || v < 0 || u >= w || v >= h) continue;
      const p = d[v * w + u]; if (!p) continue;
      const i = py * SW + px;
      if (mode === 0) fb[i] = p;
      else if (mode === 1) fb[i] = col;
      else if (u < s1 || u > w - s2 || v < s3 || v > h - s4) fb[i] |= 128;
      else fb[i] = p;
    }
  }
